name: ARMv6 and ARM64 source smoke

on:
  pull_request:
  push:
    branches:
      - noai
      - 'compat/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-smoke:
    name: ${{ matrix.target }} / Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv6
            platform: linux/arm/v6
            image: arm32v6/python:3.13-alpine
          - target: arm64
            platform: linux/arm64
            image: arm64v8/python:3.13-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64
      - name: Check Python source in target architecture
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$PWD:/src:ro" -w /src \
            "${{ matrix.image }}" \
            python scripts/ci/arm-smoke.py --expected "${{ matrix.target }}"
